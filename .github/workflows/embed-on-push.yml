name: "🧠 Embed Content Index"

# JIT 검색 인프라 건강도 모니터 — content/ 또는 docs/solutions/ 변경 시
# 임베딩 재생성 가능 여부 확인. 실제 인덱스 소비는 로컬 Claude Code 세션에서 수행.
#
# Vercel prebuild 에는 embed 포함 안 함 (120MB 모델 다운로드 비용 회피).
# 로컬 / CI 에서만 생성. Vercel 은 빈 public/embeddings.json 상태로 배포.

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "docs/solutions/**"
      - "scripts/embed-content.mjs"
      - "scripts/lib/query-router.mjs"
  schedule:
    # 매일 ~02:00 KST 다음날 목표 — drift 방어 backup
    # cron 정의는 UTC 14시 — scheduler 평균 +2~3h 지연 보정 (2026-04-26 관측)
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Cache Xenova transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: xenova-multilingual-e5-small-v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run embedding
        run: pnpm embed-content

      - name: Upload index as artifact
        uses: actions/upload-artifact@v4
        with:
          name: embeddings-${{ github.sha }}
          path: public/embeddings.json
          retention-days: 7

      - name: Report size
        run: |
          SIZE=$(du -h public/embeddings.json | cut -f1)
          CHUNKS=$(jq '.chunks | length' public/embeddings.json)
          DIM=$(jq '.dim' public/embeddings.json)
          echo "📊 인덱스: ${SIZE}, ${CHUNKS} chunks, ${DIM}d"
          echo "Size: $SIZE" >> $GITHUB_STEP_SUMMARY
          echo "Chunks: $CHUNKS" >> $GITHUB_STEP_SUMMARY
          echo "Dimension: $DIM" >> $GITHUB_STEP_SUMMARY
