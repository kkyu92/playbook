name: "🔔 Incident Follow-up Pressure"

# Phase 4a D5 — E1 흡수.
#
# 매일 1회 실행 (Cloudflare worker 가 dispatch). 최근 7일 worker-incident Issue 중
# 같은 fingerprint 의 lesson (Journal PR or self-policy Issue) 이 3일 후에도 없으면
# 워커 repo 에 'lesson-pending' reminder Issue 생성. 같은 fingerprint reminder
# 14일 이내 생성된 경우 (open 또는 closed) skip (dedup — 재발 차단).
#
# 패턴 참조: gemini-key-health.yml (cron + Issue API), weekly-triage.yml (jq 검색).
# cron 신뢰성: GH Actions silent drop → Cloudflare worker 가 timing 책임.

on:
  workflow_dispatch:  # cron 은 cloudflare-worker/ 가 매일 KST 06:00 dispatch

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  followup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect incidents + lessons (last 7 days)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          SINCE=$(date -u -d '7 days ago' +%Y-%m-%d)

          # incident Issues (label: incident + inbound) 최근 7일 — open 만
          # --state open: closed carry-over (not-planned) incident 는 lesson reminder 불필요.
          # D5 cron 이 closed incident 에도 reminder 생성 → wave-3 N=3 recurring batch pattern
          # 원인 (journal-054, 2026-06-01). open 만 보면 이미 해소된 incident 제외.
          gh issue list \
            --state open \
            --label "incident" \
            --label "inbound" \
            --limit 100 \
            --search "created:>=${SINCE}" \
            --json number,title,createdAt,body \
            > /tmp/incidents.json

          # Lessons: self-policy Issue + Journal PR (auto-ingest 가 만든 거)
          # 둘 다 [fp:xxx] tag 박혀 있음
          gh issue list \
            --state all \
            --label "self-policy" \
            --limit 200 \
            --json number,title,createdAt \
            > /tmp/lessons-issues.json

          gh pr list \
            --state all \
            --search "Auto-Ingest Journal in:title" \
            --limit 200 \
            --json number,title,createdAt \
            > /tmp/lessons-prs.json

          jq -s '.[0] + .[1]' /tmp/lessons-issues.json /tmp/lessons-prs.json > /tmp/lessons.json

          echo "incidents: $(jq 'length' /tmp/incidents.json)"
          echo "lessons:   $(jq 'length' /tmp/lessons.json)"

      - name: Find unacknowledged incidents (correlation)
        id: correlate
        run: |
          set -euo pipefail

          node scripts/find-unacknowledged-incidents.mjs \
            /tmp/incidents.json \
            /tmp/lessons.json \
            /tmp/unack.json \
            3

          UNACK_COUNT=$(jq 'length' /tmp/unack.json)
          echo "unack_count=$UNACK_COUNT" >> "$GITHUB_OUTPUT"

      - name: Create reminder Issues in worker repos
        if: steps.correlate.outputs.unack_count != '0'
        env:
          # PAT 필수 — 워커 repo 에 Issue 생성. GITHUB_TOKEN 은 본 repo 만 접근 가능
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          # workers.config.json 의 registered 만 reminder 대상 (외부 spam 방지)
          REGISTERED_REPOS=$(jq -r '.registered[]' workers.config.json)

          jq -c '.[]' /tmp/unack.json | while IFS= read -r incident; do
            INC_NUMBER=$(echo "$incident" | jq -r '.number')
            INC_TITLE=$(echo "$incident" | jq -r '.title')
            INC_BODY=$(echo "$incident" | jq -r '.body')
            INC_CREATED=$(echo "$incident" | jq -r '.createdAt')

            # body 에서 Source repo 추출: **Source:** `kkyu92/moneyballscore`
            SOURCE_REPO=$(echo "$INC_BODY" | grep -oP '\*\*Source:\*\*\s*`\K[^`]+' | head -1)
            if [ -z "$SOURCE_REPO" ]; then
              echo "::warning::incident #${INC_NUMBER} body 에서 source_repo 추출 실패, skip"
              continue
            fi

            # registered 워커만 reminder
            SOURCE_BASE=$(basename "$SOURCE_REPO")
            REGISTERED_MATCH=$(echo "$REGISTERED_REPOS" | grep -F "$SOURCE_BASE" || true)
            if [ -z "$REGISTERED_MATCH" ]; then
              # basename 매칭 실패 시 prefix 매칭 시도 (moneyballscore → moneyball)
              MATCHED=""
              while IFS= read -r reg; do
                if [[ "$SOURCE_BASE" == "$reg"* ]]; then
                  MATCHED="$reg"
                  break
                fi
              done <<< "$REGISTERED_REPOS"
              if [ -z "$MATCHED" ]; then
                echo "::warning::source_repo '$SOURCE_REPO' 가 workers.config.json registered 에 없음, skip"
                continue
              fi
            fi

            # fingerprint 추출 (title 의 [fp:xxx])
            FP=$(echo "$INC_TITLE" | grep -oP '\[fp:\K[^\]]+' | head -1)
            if [ -z "$FP" ]; then
              echo "::warning::incident #${INC_NUMBER} title 에서 fingerprint 추출 실패, skip"
              continue
            fi

            REMINDER_TITLE="🔔 Lesson pending: incident [fp:${FP}] 후 3+일 무대응"

            # dedup — 같은 fingerprint 의 lesson-pending Issue 가 이미 워커 repo 에 있으면 skip
            # --state all: closed reminder 재생성 방지 (batch-close 후 무한 재발 차단)
            # 14일 creation filter: 오래된 closed reminder 는 새 incident 허용
            DEDUP_SINCE=$(date -u -d '14 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-14d +%Y-%m-%d)
            EXISTING=$(gh issue list \
              --repo "$SOURCE_REPO" \
              --state all \
              --label "lesson-pending" \
              --search "created:>=${DEDUP_SINCE}" \
              --limit 50 \
              --json number,title \
              2>/dev/null \
              | jq -r --arg fp "[fp:${FP}]" '[.[] | select(.title | contains($fp))] | .[0].number // empty' || echo "")

            if [ -n "$EXISTING" ]; then
              echo "워커 ${SOURCE_REPO}: 기존 reminder #${EXISTING} 존재, skip"
              continue
            fi

            HUB_INCIDENT_URL="https://github.com/${GITHUB_REPOSITORY}/issues/${INC_NUMBER}"

            REMINDER_BODY=$(cat <<RBEND
          ## 미해결 incident → lesson 변환 reminder

          **Hub incident:** ${HUB_INCIDENT_URL} (#${INC_NUMBER})
          **Created:** \`${INC_CREATED}\`
          **Fingerprint:** \`${FP}\`

          이 incident 가 허브에 박힌 지 **3일 이상** 지났는데 같은 fingerprint 의 lesson commit 이 아직 없습니다.

          ## 다음 액션

          1. 본 워커에서 \`lesson:\` prefix commit 으로 회고 박제
          2. 또는 외부 요인이라 회수 불가능하면 → 본 reminder close
          3. 같은 fingerprint 의 lesson commit 이 들어오면 다음 D5 cron 이 자동 close 안 함 (수동 close 필수)

          ## 자동 생성

          허브 \`incident-followup.yml\` workflow (Phase 4a D5).
          허브가 매일 1회 fingerprint 매칭 → 미해결 시 reminder.
          RBEND
          )

            # 라벨 self-bootstrap (워커 repo 에서)
            gh label create lesson-pending --repo "$SOURCE_REPO" --color "fbca04" --description "incident → lesson 변환 reminder (D5)" 2>/dev/null || true

            gh issue create \
              --repo "$SOURCE_REPO" \
              --title "$REMINDER_TITLE" \
              --body "$REMINDER_BODY" \
              --label "lesson-pending"

            echo "✅ reminder created in ${SOURCE_REPO}"
          done

      - name: Self-report on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          gh label create hub-self-report --color "b60205" --description "허브 workflow 자체 실패" 2>/dev/null || true

          # 기존 open Issue 있으면 코멘트, 없으면 신규
          EXISTING=$(gh issue list \
            --state open \
            --label "hub-self-report" \
            --limit 1 \
            --json number \
            | jq -r '.[0].number // empty')

          BODY="🚨 incident-followup.yml run #${GITHUB_RUN_NUMBER} 실패 — D5 cron 결과 확인 필요. silent drop 우려.

          Run: ${RUN_URL}"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "🚨 incident-followup.yml 실패 (Phase 4a D5)" \
              --body "$BODY" \
              --label "hub-self-report"
          fi
