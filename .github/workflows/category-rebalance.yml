name: "🗂️ Category Rebalance Scan"

# 카테고리 분포 쏠림 / coherence / outlier / 선언-현실 드리프트 탐지.
# self-gating: N_total < 30 이면 silent exit (Issue 미생성).
# 데이터 성장 속도에 자가 적응 — 지금은 skip, 엔트리 누적되면 자동 활성화.
#
# 참조: memory/project_pivot_followup_roadmap.md (PR 4)
# 참조: memory/feedback_snapshot_as_constraint_fallacy.md

on:
  workflow_dispatch:  # cron 은 cloudflare-worker/ 가 매월1일 KST 06:00 dispatch

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Cache Xenova transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: xenova-multilingual-e5-small-v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build fresh embeddings
        run: pnpm embed-content

      - name: Run category rebalance scan
        id: scan
        run: |
          set -euo pipefail
          RESULT=$(node scripts/category-rebalance.mjs --json)
          echo "$RESULT" > /tmp/rebalance-result.json

          SKIPPED=$(echo "$RESULT" | jq -r '.skipped')
          N_TOTAL=$(echo "$RESULT" | jq -r '.n_total')
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
          echo "n_total=$N_TOTAL" >> $GITHUB_OUTPUT

          if [ "$SKIPPED" = "true" ]; then
            REASON=$(echo "$RESULT" | jq -r '.reason')
            echo "### 🗂️ Rebalance — SKIP" >> $GITHUB_STEP_SUMMARY
            echo "$REASON" >> $GITHUB_STEP_SUMMARY
          else
            node scripts/category-rebalance.mjs >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create or update issue
        if: steps.scan.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh label create category-rebalance --color "0ea5e9" --description "카테고리 분포/coherence 자동 스캔" 2>/dev/null || true

          DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          RESULT=$(cat /tmp/rebalance-result.json)
          N_TOTAL=${{ steps.scan.outputs.n_total }}

          REPORT=$(node scripts/category-rebalance.mjs)

          # 드리프트 요약
          DRIFT_MISSING=$(echo "$RESULT" | jq -r '.drift.declaredButMissing | join(", ") // ""')
          DRIFT_UNDECL=$(echo "$RESULT" | jq -r '.drift.presentButUndeclared | join(", ") // ""')
          OUTLIER_COUNT=$(echo "$RESULT" | jq -r '.outliers | length')
          IMBALANCE_FLAG=$(echo "$RESULT" | jq -r '.imbalance.flagged')

          # 대응 체크리스트
          CHECKLIST=""
          if [ "$OUTLIER_COUNT" != "0" ]; then
            CHECKLIST="$CHECKLIST\n- [ ] Outlier entries (${OUTLIER_COUNT}건) 검토 → 재분류 vs 카테고리 정의 갱신 결정"
          fi
          if [ "$IMBALANCE_FLAG" = "true" ]; then
            CHECKLIST="$CHECKLIST\n- [ ] Imbalance 해소 — 큰 카테고리 분할 또는 작은 카테고리 통합/제거 검토"
          fi
          if [ -n "$DRIFT_MISSING" ]; then
            CHECKLIST="$CHECKLIST\n- [ ] 선언됐지만 디렉터리 없음: \`${DRIFT_MISSING}\` — \`scripts/lib/categories.mjs\` 에서 제거 or 디렉터리 생성"
          fi
          if [ -n "$DRIFT_UNDECL" ]; then
            CHECKLIST="$CHECKLIST\n- [ ] 디렉터리 있지만 선언 안 됨: \`${DRIFT_UNDECL}\` — \`scripts/lib/categories.mjs\` 에 추가 or 디렉터리 제거"
          fi
          CHECKLIST="$CHECKLIST\n- [ ] \`src/lib/schema.ts\` CATEGORIES 와 동기화 확인"
          CHECKLIST="$CHECKLIST\n- [ ] 완료 후 이 Issue close"

          EXISTING=$(gh issue list --label "category-rebalance" --state open --json number --jq '.[0].number // empty')

          BODY=$(cat <<EOF
          ## 🗂️ Category Rebalance Report ($DATE)

          **N_total** = ${N_TOTAL} entries (journal 제외)

          $REPORT

          ### 📋 대응 체크리스트
          $(echo -e "$CHECKLIST")

          ---

          > 자동 스캔: 매월 1일 09:00 KST
          > Gate: N_total < 30 silent exit, N_cluster < 10 그 카테고리 분석만 skip
          > 로컬 재현: \`pnpm embed-content && node scripts/category-rebalance.mjs\`
          EOF
          )

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "🗂️ Category Rebalance — ${N_TOTAL} entries ($DATE)" --body "$BODY"
            echo "✅ Issue #$EXISTING 업데이트"
          else
            gh issue create \
              --title "🗂️ Category Rebalance — ${N_TOTAL} entries ($DATE)" \
              --body "$BODY" \
              --label "category-rebalance"
          fi
