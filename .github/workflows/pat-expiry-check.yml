name: PAT Expiry Check

on:
  schedule:
    # 매주 토요일 KST 09:00 의도 = UTC 토요일 00:00.
    # GitHub scheduler 평균 +2~3h 지연 → -3h offset = UTC 금요일 21:00.
    - cron: '0 21 * * 5'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure pat-expiry label
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh label create pat-expiry \
            --repo "$GITHUB_REPOSITORY" \
            --description "GH_PAT 만료 알림" \
            --color FFA500 \
            2>/dev/null || true

      - name: Inspect GH_PAT expiry
        env:
          # Fallback: GH_PAT 미설정/만료 시에도 워크플로 자체는 GITHUB_TOKEN 으로 진행
          # (Issue 생성/comment 가능 → 사용자에게 가시화)
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_PAT_RAW: ${{ secrets.GH_PAT }}
          THRESHOLD_DAYS: 14
        run: |
          set -euo pipefail

          # 진단 1: GH_PAT secret 자체 설정 여부
          if [ -z "${GH_PAT_RAW:-}" ]; then
            TOKEN_STATE="missing"
            echo "::warning::GH_PAT secret 미설정 — GITHUB_TOKEN fallback 사용 중"
          else
            TOKEN_STATE="present"
          fi

          # 진단 2: 응답 헤더로 fine-grained 여부 확인
          # Fine-grained PAT 응답 헤더: github-authentication-token-expiration
          # 포맷: "2027-04-27 10:30:00 UTC"
          # Classic PAT 또는 GITHUB_TOKEN 사용 시 헤더 없음
          EXPIRY=""
          if [ "$TOKEN_STATE" = "present" ]; then
            EXPIRY=$(GH_TOKEN="$GH_PAT_RAW" gh api /user -i 2>/dev/null \
              | grep -i "^github-authentication-token-expiration:" \
              | cut -d: -f2- \
              | xargs || true)
          fi

          if [ -z "$EXPIRY" ]; then
            case "$TOKEN_STATE" in
              missing)
                CAUSE="GH_PAT secret 미설정 또는 빈 값"
                TITLE="🚨 GH_PAT secret 미설정 — fine-grained 전환 필요 (T5)"
                ;;
              present)
                CAUSE="GH_PAT 가 Classic PAT 거나 만료/무효 (헤더 없음)"
                TITLE="🔧 GH_PAT 가 Classic 또는 무효 — fine-grained 전환 필요 (T5)"
                ;;
            esac

            echo "::warning::${CAUSE}"

            EXISTING=$(gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --label pat-expiry \
              --state open \
              --search "fine-grained 전환 필요" \
              --json number \
              --jq '.[0].number // empty')

            if [ -z "$EXISTING" ]; then
              cat > /tmp/pat-issue-body.md <<BODY
          PAT expiry 워크플로 진단:

          - **Token 상태**: ${TOKEN_STATE}
          - **원인**: ${CAUSE}

          ## 가능한 케이스
          - GH_PAT secret 미설정/빈 값
          - Classic PAT 사용 중 (만료 무한정 가능 → 응답 헤더 없음)
          - 만료/revoke 된 토큰
          - Fine-grained 발행 후 Secret 교체 누락

          ## 조치
          1. https://github.com/settings/personal-access-tokens 에서 fine-grained PAT 발행 (만료 1년)
          2. 권한:
             - Contents = Read and write
             - Pull requests = Read and write
             - Issues = Read and write
             - Workflows = Read and write
             - Metadata = Read (자동)
          3. Selected repositories: \`kkyu92/playbook\`
          4. Repo Settings → Secrets → \`GH_PAT\` 값 설정/교체
          5. 본 워크플로 \`workflow_dispatch\` 수동 실행 → 헤더 정상 시 이 Issue close
          BODY
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$TITLE" \
                --label pat-expiry \
                --body-file /tmp/pat-issue-body.md
            fi
            exit 0
          fi

          echo "GH_PAT 만료일: $EXPIRY"

          EXPIRY_TS=$(date -d "$EXPIRY" +%s)
          NOW_TS=$(date +%s)
          DAYS_LEFT=$(( (EXPIRY_TS - NOW_TS) / 86400 ))

          echo "남은 일수: ${DAYS_LEFT}일 (임계값: ${THRESHOLD_DAYS}일)"

          if [ "$DAYS_LEFT" -gt "$THRESHOLD_DAYS" ]; then
            echo "OK — 임계값 초과, Issue 생성 안 함"
            exit 0
          fi

          ISSUE_TITLE="⚠️ GH_PAT 만료까지 ${DAYS_LEFT}일 남음 (${EXPIRY})"

          EXISTING=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --label pat-expiry \
            --state open \
            --search "만료까지" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Re-check: ${DAYS_LEFT}일 남음 (만료 ${EXPIRY})"
          else
            cat > /tmp/pat-expiry-body.md <<BODY
          ## GH_PAT 만료 알림

          - **만료일**: ${EXPIRY}
          - **남은 일수**: ${DAYS_LEFT}일
          - **임계값**: ${THRESHOLD_DAYS}일

          ## 갱신 절차

          1. https://github.com/settings/personal-access-tokens 에서 새 fine-grained PAT 발행 (만료 1년)
          2. 권한:
             - Contents = Read and write
             - Pull requests = Read and write
             - Issues = Read and write
             - Workflows = Read and write
             - Metadata = Read (자동)
          3. Selected repositories: \`kkyu92/playbook\`
          4. Repo Settings → Secrets → \`GH_PAT\` 값 교체
          5. 본 워크플로 \`workflow_dispatch\` 수동 실행 → ${THRESHOLD_DAYS}일 초과 확인 후 이 Issue close

          매주 토요일 KST 09:00 재확인 (Issue 존재 시 comment 추가).
          BODY
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --label pat-expiry \
              --body-file /tmp/pat-expiry-body.md
          fi
