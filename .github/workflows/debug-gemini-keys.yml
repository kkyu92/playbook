name: "🔬 Debug — Gemini Keys"

# 임시 debug workflow. fallback 키 설정 이슈 확정 후 삭제.
# 실행: Actions 탭 → Debug — Gemini Keys → Run workflow

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets non-empty + distinct
        env:
          PRIMARY: ${{ secrets.GEMINI_API_KEY }}
          FALLBACK: ${{ secrets.GEMINI_API_KEY_FALLBACK }}
        run: |
          if [ -z "$PRIMARY" ]; then
            echo "::error::GEMINI_API_KEY is empty or unset"
            exit 1
          fi
          if [ -z "$FALLBACK" ]; then
            echo "::error::GEMINI_API_KEY_FALLBACK is empty or unset"
            exit 1
          fi

          PRIMARY_HASH=$(printf '%s' "$PRIMARY" | sha256sum | cut -c1-16)
          FALLBACK_HASH=$(printf '%s' "$FALLBACK" | sha256sum | cut -c1-16)

          echo "PRIMARY  length: ${#PRIMARY}, sha256[0:16]: $PRIMARY_HASH"
          echo "FALLBACK length: ${#FALLBACK}, sha256[0:16]: $FALLBACK_HASH"

          if [ "$PRIMARY_HASH" = "$FALLBACK_HASH" ]; then
            echo "::error::Primary와 Fallback이 동일한 값입니다 (복붙 의심)"
            exit 1
          else
            echo "✅ Primary ≠ Fallback (서로 다른 값)"
          fi

      - name: Test PRIMARY key — ping Gemini API
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          CODE=$(curl -s -o /tmp/primary.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$KEY" \
            -d '{"contents":[{"parts":[{"text":"Reply with OK only."}]}]}')
          echo "HTTP: $CODE"
          if [ "$CODE" = "200" ]; then
            echo "✅ PRIMARY key valid — API 호출 성공"
          elif [ "$CODE" = "429" ]; then
            echo "⚠️  PRIMARY key quota 초과 (하지만 키 자체는 유효)"
            head -c 300 /tmp/primary.json
          else
            echo "::error::PRIMARY key invalid (HTTP $CODE)"
            head -c 500 /tmp/primary.json
            exit 1
          fi

      - name: Test FALLBACK key — ping Gemini API
        env:
          KEY: ${{ secrets.GEMINI_API_KEY_FALLBACK }}
        run: |
          CODE=$(curl -s -o /tmp/fallback.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$KEY" \
            -d '{"contents":[{"parts":[{"text":"Reply with OK only."}]}]}')
          echo "HTTP: $CODE"
          if [ "$CODE" = "200" ]; then
            echo "✅ FALLBACK key valid — API 호출 성공"
          elif [ "$CODE" = "429" ]; then
            echo "⚠️  FALLBACK key quota 초과 (하지만 키 자체는 유효)"
            head -c 300 /tmp/fallback.json
          else
            echo "::error::FALLBACK key invalid (HTTP $CODE)"
            head -c 500 /tmp/fallback.json
            exit 1
          fi

      - name: buildClients simulation — gemini-client.mjs 로직 재현
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_FALLBACK: ${{ secrets.GEMINI_API_KEY_FALLBACK }}
        run: |
          node -e "
            const primary = process.env.GEMINI_API_KEY;
            const fallback = process.env.GEMINI_API_KEY_FALLBACK;
            const clients = ['primary'];
            if (fallback && fallback !== primary) clients.push('fallback');
            console.log('clients.length =', clients.length);
            console.log('clients:', clients.join(', '));
            if (clients.length !== 2) {
              console.error('::error::buildClients가 1개만 로드 — 워크플로 재현');
              process.exit(1);
            } else {
              console.log('✅ buildClients가 2개 로드 — gemini-client 로직 정상');
            }
          "
