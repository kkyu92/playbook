name: "🔬 Debug — Gemini Keys"

# 임시 debug workflow. fallback 키 설정 이슈 확정 후 삭제.
# 실행: Actions 탭 → Debug — Gemini Keys → Run workflow

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check all 3 secrets non-empty + distinct
        env:
          PRIMARY: ${{ secrets.GEMINI_API_KEY }}
          FALLBACK: ${{ secrets.GEMINI_API_KEY_FALLBACK }}
          FALLBACK_2: ${{ secrets.GEMINI_API_KEY_FALLBACK_2 }}
        run: |
          check_non_empty() {
            if [ -z "$2" ]; then
              echo "::error::$1 is empty or unset"
              return 1
            fi
            return 0
          }
          check_non_empty "GEMINI_API_KEY" "$PRIMARY" || exit 1
          check_non_empty "GEMINI_API_KEY_FALLBACK" "$FALLBACK" || exit 1
          check_non_empty "GEMINI_API_KEY_FALLBACK_2" "$FALLBACK_2" || exit 1

          PRIMARY_HASH=$(printf '%s' "$PRIMARY" | sha256sum | cut -c1-16)
          FALLBACK_HASH=$(printf '%s' "$FALLBACK" | sha256sum | cut -c1-16)
          FALLBACK_2_HASH=$(printf '%s' "$FALLBACK_2" | sha256sum | cut -c1-16)

          echo "PRIMARY     length: ${#PRIMARY}, sha256[0:16]: $PRIMARY_HASH"
          echo "FALLBACK    length: ${#FALLBACK}, sha256[0:16]: $FALLBACK_HASH"
          echo "FALLBACK_2  length: ${#FALLBACK_2}, sha256[0:16]: $FALLBACK_2_HASH"

      - name: FALLBACK_2 — listModels (read-only, quota 무관 — auth 검증)
        env:
          KEY: ${{ secrets.GEMINI_API_KEY_FALLBACK_2 }}
        run: |
          echo "🔍 listModels — 키 자체 인증/API enablement 검증 (quota 소비 안 함)"
          CODE=$(curl -s -o /tmp/models.json -w "%{http_code}" \
            "https://generativelanguage.googleapis.com/v1beta/models?key=$KEY")
          echo "HTTP: $CODE"
          if [ "$CODE" = "200" ]; then
            echo "✅ 인증 성공 — API enable 됨, 키 유효"
            echo "사용 가능 모델 수: $(jq '.models | length' /tmp/models.json 2>/dev/null || echo '?')"
            echo "모델 이름 sample:"
            jq -r '.models[0:5] | .[].name' /tmp/models.json 2>/dev/null || head -c 300 /tmp/models.json
          else
            echo "::error::listModels 실패 — 키 invalid 또는 API disabled"
            head -c 1000 /tmp/models.json
          fi

      - name: FALLBACK_2 — gemini-1.5-flash (free tier 가장 관대)
        env:
          KEY: ${{ secrets.GEMINI_API_KEY_FALLBACK_2 }}
        run: |
          CODE=$(curl -s -o /tmp/f2_15flash.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$KEY" \
            -d '{"contents":[{"parts":[{"text":"Reply OK."}]}]}')
          echo "HTTP: $CODE"
          if [ "$CODE" = "200" ]; then
            echo "✅ gemini-1.5-flash 작동 → gemini-2.0-flash 만의 tier 제한"
          else
            echo "--- Response ---"
            head -c 1500 /tmp/f2_15flash.json
            echo ""
          fi

      - name: FALLBACK_2 — gemini-1.5-flash-8b
        env:
          KEY: ${{ secrets.GEMINI_API_KEY_FALLBACK_2 }}
        run: |
          CODE=$(curl -s -o /tmp/f2_8b.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-8b:generateContent?key=$KEY" \
            -d '{"contents":[{"parts":[{"text":"Reply OK."}]}]}')
          echo "HTTP: $CODE"
          if [ "$CODE" = "200" ]; then
            echo "✅ gemini-1.5-flash-8b 작동"
          else
            head -c 1000 /tmp/f2_8b.json
            echo ""
          fi

      - name: FALLBACK_2 — gemini-2.0-flash (전체 body 덤프)
        env:
          KEY: ${{ secrets.GEMINI_API_KEY_FALLBACK_2 }}
        run: |
          CODE=$(curl -s -o /tmp/f2_20flash.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$KEY" \
            -d '{"contents":[{"parts":[{"text":"Reply OK."}]}]}')
          echo "HTTP: $CODE"
          echo "--- Full body ---"
          cat /tmp/f2_20flash.json
          echo ""
          echo "--- Parsed quota details ---"
          jq '.error.details[]? | select(.["@type"] | contains("QuotaFailure"))' /tmp/f2_20flash.json 2>/dev/null || echo "(no quota details)"
          echo "--- Retry info ---"
          jq '.error.details[]? | select(.["@type"] | contains("RetryInfo"))' /tmp/f2_20flash.json 2>/dev/null || echo "(no retry info)"

      - name: FALLBACK_2 — gemini-2.5-flash
        env:
          KEY: ${{ secrets.GEMINI_API_KEY_FALLBACK_2 }}
        run: |
          CODE=$(curl -s -o /tmp/f2_25flash.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$KEY" \
            -d '{"contents":[{"parts":[{"text":"Reply OK."}]}]}')
          echo "HTTP: $CODE"
          if [ "$CODE" = "200" ]; then
            echo "✅ gemini-2.5-flash 작동"
          else
            head -c 1000 /tmp/f2_25flash.json
            echo ""
          fi

      - name: FALLBACK_2 — retry-after 패턴 확인 (2회 연속 호출)
        env:
          KEY: ${{ secrets.GEMINI_API_KEY_FALLBACK_2 }}
        run: |
          echo "=== 호출 1 ==="
          curl -s -o /tmp/r1.json -w "HTTP: %{http_code}\n" \
            -X POST -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$KEY" \
            -d '{"contents":[{"parts":[{"text":"Hi"}]}]}'
          R1=$(jq -r '.error.details[]? | select(.["@type"] | contains("RetryInfo")) | .retryDelay' /tmp/r1.json 2>/dev/null)
          echo "retryDelay #1: $R1"

          echo "=== 2초 대기 ==="
          sleep 2

          echo "=== 호출 2 ==="
          curl -s -o /tmp/r2.json -w "HTTP: %{http_code}\n" \
            -X POST -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$KEY" \
            -d '{"contents":[{"parts":[{"text":"Hi"}]}]}'
          R2=$(jq -r '.error.details[]? | select(.["@type"] | contains("RetryInfo")) | .retryDelay' /tmp/r2.json 2>/dev/null)
          echo "retryDelay #2: $R2"

          echo ""
          echo "해석:"
          echo "  동일값 반복 → quota 할당 자체가 0 (tier 문제)"
          echo "  감소 → 정상 rate limit (시간 지나면 회복)"

      - name: PRIMARY — gemini-2.0-flash (비교용)
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          CODE=$(curl -s -o /tmp/pri.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$KEY" \
            -d '{"contents":[{"parts":[{"text":"Hi"}]}]}')
          echo "HTTP: $CODE"
          if [ "$CODE" = "429" ]; then
            echo "--- quotaId (비교용) ---"
            jq '.error.details[]? | select(.["@type"] | contains("QuotaFailure")) | .violations[]? | {quotaMetric, quotaId}' /tmp/pri.json 2>/dev/null
          fi

      - name: FALLBACK — gemini-2.0-flash (비교용)
        env:
          KEY: ${{ secrets.GEMINI_API_KEY_FALLBACK }}
        run: |
          CODE=$(curl -s -o /tmp/fb.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$KEY" \
            -d '{"contents":[{"parts":[{"text":"Hi"}]}]}')
          echo "HTTP: $CODE"
          if [ "$CODE" = "429" ]; then
            echo "--- quotaId (비교용) ---"
            jq '.error.details[]? | select(.["@type"] | contains("QuotaFailure")) | .violations[]? | {quotaMetric, quotaId}' /tmp/fb.json 2>/dev/null
          fi
