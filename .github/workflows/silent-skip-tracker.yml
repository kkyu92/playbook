name: "🔇 Silent Skip Tracker"

# 추적 대상 워크플로의 직전 5건 result 조회 → skipped/failure 가 임계 (3건) 이상
# 누적 시 issue 자동 생성. fp dedup (같은 workflow + head_sha 8자) 으로 중복 차단.
#
# 박제 trigger: 2026-05-04 ai-review-chain.yml 5건 연속 skipped 1주일 누적
# (5-3 ca91aac fix 후 수정 0건). 사용자 명시 질문 받기 전 미발견.
# `feedback_risk_evidence_impact_analysis` + `feedback_lazy_enrichment` 적용 범위
# 정정의 인프라 layer 구현. 메모리 박제만으론 자가 호출 보장 X → 시스템 강제 visibility.
#
# cron 신뢰성: 기본 GH schedule + workflow_dispatch. 향후 cloudflare-worker 분기
# 추가 가능 (`feedback_cloudflare_cron_slot_conservation` 정합 — 단일 expression
# + decideMode 분기로 슬롯 보존).

on:
  schedule:
    - cron: "0 21 * * *"  # 매일 06:00 KST (UTC 21:00)
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Scan tracked workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 추적 대상 — silent skip/fail 누적 위험이 있는 핵심 워크플로만.
          # 의도된 skip 영역 제외 원칙:
          # - ai-review-chain.yml: workflow_run.head_branch != main 가드 = 의도 정합
          #   (chain 갭은 별개 carry-over: trigger workflow head_branch 와 PR head 분리 갭)
          # - auto-workers-tag.yml: OAuth 24h 만료 옵션 D 채택 = 자율 정지 허용 영역
          # 확장: 새 silent skip 사건 발견 시 추가.
          WORKFLOWS=(
            "daily-ingest-geeknews.yml"
            "curate-routine.yml"
          )

          THRESHOLD=3
          CREATED=0

          for WF in "${WORKFLOWS[@]}"; do
            RUNS_JSON=$(gh run list --repo "$REPO" --workflow="$WF" --limit 5 \
              --json conclusion,createdAt,databaseId,headSha 2>/dev/null || echo "[]")

            COUNT=$(echo "$RUNS_JSON" | jq -r '
              [.[] | .conclusion]
              | map(select(. == "skipped" or . == "failure"))
              | length
            ')

            echo "::group::$WF — $COUNT silent fails / 5"
            echo "$RUNS_JSON" | jq -r '.[] | "  \(.conclusion // "?") \(.createdAt) \(.databaseId)"'
            echo "::endgroup::"

            if [ "$COUNT" -lt "$THRESHOLD" ]; then
              continue
            fi

            HEAD_SHA=$(echo "$RUNS_JSON" | jq -r '.[0].headSha[:8] // "unknown"')
            FP="silent-skip-${WF%.yml}-${HEAD_SHA}"

            EXISTING=$(gh issue list --repo "$REPO" --state open \
              --search "in:title $FP" --json number --jq '.[0].number // empty')

            if [ -n "$EXISTING" ]; then
              echo "::notice::$WF — fp $FP issue #$EXISTING already open, skip"
              continue
            fi

            LATEST_ID=$(echo "$RUNS_JSON" | jq -r '.[0].databaseId // "unknown"')
            KST_NOW=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
            ORGANISM="${WF%.yml}"

            {
              echo "https://github.com/${REPO}/actions/runs/${LATEST_ID}"
              echo ""
              echo "silent skip — ${COUNT}/${THRESHOLD} events in last 5 runs (fp: \`$FP\`)"
              echo ""
              echo "Next: \`gh run view ${LATEST_ID} --repo ${REPO} --log\`"
              echo ""
              echo "---"
              echo "source: plan #1 / organism: ${ORGANISM}"
            } > /tmp/silent-skip-body.md

            gh issue create --repo "$REPO" \
              --title "[organism] ${ORGANISM} silent-skip [$FP] @ ${KST_NOW}" \
              --label hub-self-report \
              --body-file /tmp/silent-skip-body.md

            CREATED=$((CREATED + 1))
            echo "::warning::Created silent skip issue for $WF ($COUNT/$THRESHOLD)"
          done

          echo "Total issues created: $CREATED"

      - name: Scan for 0s YAML parse failures (cross-workflow)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 0s failure = YAML validation error (jobs[] empty, self-report step cannot run).
          # Cross-workflow scan: any workflow with 3+ consecutive 0s failures = YAML parse issue.
          THRESHOLD=3
          KST_NOW=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')

          # Collect last 200 runs
          gh run list --repo "$REPO" --limit 200 \
            --json conclusion,startedAt,updatedAt,workflowName,databaseId,headSha \
            > /tmp/all_runs.json 2>/dev/null || echo "[]" > /tmp/all_runs.json

          # Filter: failure + duration < 10s (0s YAML parse failures)
          python3 -c "
          import json
          from datetime import datetime
          runs = json.load(open('/tmp/all_runs.json'))
          zero = [r for r in runs
                  if r.get('conclusion') == 'failure'
                  and (lambda s, u: (u - s).total_seconds() < 10)(
                    datetime.fromisoformat(r['startedAt'].replace('Z','+00:00')),
                    datetime.fromisoformat(r['updatedAt'].replace('Z','+00:00'))
                  )]
          json.dump(zero, open('/tmp/zero_failures.json','w'))
          from collections import Counter
          counts = Counter(r['workflowName'] for r in zero)
          json.dump(dict(counts), open('/tmp/zero_counts.json','w'))
          print('0s failure counts:', dict(counts))
          "

          # Create issues for workflows exceeding threshold
          python3 -c "
          import json, subprocess, os

          counts = json.load(open('/tmp/zero_counts.json'))
          zero_runs = json.load(open('/tmp/zero_failures.json'))
          repo = os.environ['REPO']
          kst_now = '$KST_NOW'
          threshold = $THRESHOLD
          created = 0

          for wf_name, count in counts.items():
            if count < threshold:
              continue
            wf_slug = wf_name.replace(' ', '-').lower()[:30]
            wf_runs = [r for r in zero_runs if r['workflowName'] == wf_name]
            latest = wf_runs[0] if wf_runs else {}
            latest_id = latest.get('databaseId', '?')
            head_sha = latest.get('headSha', '?')[:8]
            fp = 'zero-failure-' + wf_slug + '-' + head_sha

            existing = subprocess.run(
              ['gh','issue','list','--repo',repo,'--state','open',
               '--search','in:title ' + fp,'--json','number','--jq','.[0].number // empty'],
              capture_output=True, text=True).stdout.strip()
            if existing:
              print('SKIP duplicate:', fp, 'issue #' + existing)
              continue

            run_url = 'https://github.com/' + repo + '/actions/runs/' + str(latest_id)
            body_lines = [
              run_url, '',
              '0s failure: ' + str(count) + ' occurrences detected (last 200 runs).',
              'Workflow file issue: YAML syntax error, missing action version, or permissions.',
              'In-workflow self-report step cannot fire at YAML validation level.',
              '',
              'Diagnose: gh run view ' + str(latest_id) + ' --repo ' + repo,
              'Ref: harness-engineering/github-actions-0s-failure-self-report-blind-spot',
              '', '---', 'fp: ' + fp
            ]
            body = '\n'.join(body_lines)
            title = '[0s-failure] ' + wf_name + ' [' + fp + '] @ ' + kst_now

            result = subprocess.run(
              ['gh','issue','create','--repo',repo,
               '--title',title,'--label','hub-self-report','--body',body],
              capture_output=True, text=True)
            if result.returncode == 0:
              print('Created 0s-failure issue for ' + wf_name + ' (' + str(count) + ' occurrences)')
              created += 1
            else:
              print('ERROR:', result.stderr[:200])
          print('Total 0s-failure issues created:', created)
          "
