name: "🚀 Solution Promotion Scan"

# docs/solutions/ 카테고리 N≥3 누적 → 승격 후보 Issue 자동 생성/갱신.
# 이식: Mino777/ai-study 의 같은 워크플로 (2026-04-20).

on:
  push:
    branches: [main]
    paths:
      - "docs/solutions/**"
  schedule:
    # 매주 월요일 09:00 KST (UTC 0시)
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run promotion scan
        id: scan
        run: |
          set -euo pipefail
          RESULT=$(node scripts/scan-promotions.mjs --json)
          echo "$RESULT" > /tmp/scan-result.json

          PROMOTABLE=$(echo "$RESULT" | jq '.promotable | length')
          TOTAL=$(echo "$RESULT" | jq '[.categories[].count] | add // 0')
          echo "promotable=$PROMOTABLE" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

      - name: Create or update issue
        if: steps.scan.outputs.promotable != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 라벨 self-bootstrap
          gh label create promotion-scan --color "8b5cf6" --description "솔루션 승격 후보 자동 감지" 2>/dev/null || true

          DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          RESULT=$(cat /tmp/scan-result.json)
          PROMOTABLE=${{ steps.scan.outputs.promotable }}
          TOTAL=${{ steps.scan.outputs.total }}

          TABLE="| 카테고리 | 솔루션 수 | 승격 형태 | 위치 |\n|---|---|---|---|"
          while IFS= read -r line; do
            CAT=$(echo "$line" | jq -r '.category')
            COUNT=$(echo "$line" | jq -r '.count')
            TYPE=$(echo "$line" | jq -r '.type')
            LOC=$(echo "$line" | jq -r '.location')
            TABLE="$TABLE\n| $CAT | $COUNT | $TYPE | \`$LOC\` |"
          done < <(echo "$RESULT" | jq -c '.promotable[]')

          # 카테고리별 대응 체크리스트 생성 (A4)
          CHECKLIST=""
          while IFS= read -r line; do
            CAT=$(echo "$line" | jq -r '.category')
            COUNT=$(echo "$line" | jq -r '.count')
            TYPE=$(echo "$line" | jq -r '.type')
            LOC=$(echo "$line" | jq -r '.location')
            REASON=$(echo "$line" | jq -r '.reason')
            CT_PATH="docs/solutions/$CAT/_compiled-truth.md"
            CT_EXISTS="작성/갱신"
            [ -f "$CT_PATH" ] && CT_EXISTS="갱신" || CT_EXISTS="신규 작성"

            CHECKLIST="$CHECKLIST\n\n**[${CAT}] — ${TYPE} 승격 후보 (${COUNT}건)**"
            CHECKLIST="$CHECKLIST\n- [ ] \`$CT_PATH\` $CT_EXISTS"
            CHECKLIST="$CHECKLIST\n  - [ ] 종합 header: N = $COUNT, 최종 갱신 = $DATE, 마지막 발생 날짜 업데이트"
            CHECKLIST="$CHECKLIST\n  - [ ] 주요 교훈 요약 테이블 행 추가/갱신 (솔루션당 1행)"
            CHECKLIST="$CHECKLIST\n  - [ ] 메타 패턴 추출 (2건+ 교차 관찰되는 상위 패턴만)"
            CHECKLIST="$CHECKLIST\n  - [ ] 현재 최선 해결책 / 코드 게이트 상태 기술"
            CHECKLIST="$CHECKLIST\n- [ ] 승격 검토: \`$LOC\`"
            CHECKLIST="$CHECKLIST\n  - 근거: $REASON"
          done < <(echo "$RESULT" | jq -c '.promotable[]')

          EXISTING=$(gh issue list --label "promotion-scan" --state open --json number --jq '.[0].number // empty')

          BODY=$(cat <<EOF
          ## 🚀 솔루션 승격 스캔 보고 ($DATE)

          **총 솔루션**: ${TOTAL}건 | **승격 후보**: ${PROMOTABLE} 카테고리 (N≥3)

          ### 승격 후보

          $(echo -e "$TABLE")

          ### 전체 카테고리 현황

          $(echo "$RESULT" | jq -r '.categories[] | "- **\(.name)**: \(.count)건\(if .promotable then " ✅" else "" end)"')

          ### 📋 대응 체크리스트
          $(echo -e "$CHECKLIST")

          - [ ] 완료 후 이 Issue close

          ---

          > 자동 스캔: docs/solutions/ 변경 시 + 매주 월요일 09:00 KST
          > 스키마: \`docs/solutions/README.md\`
          > \`_compiled-truth.md\` 작성은 사람이 수행 (LLM 자동 생성은 품질 검증 실패로 폐기, 2026-04-24)
          EOF
          )

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "🚀 솔루션 승격 후보 ${PROMOTABLE}건 ($DATE)" --body "$BODY"
            echo "✅ Issue #$EXISTING 업데이트"
          else
            gh issue create \
              --title "🚀 솔루션 승격 후보 ${PROMOTABLE}건 ($DATE)" \
              --body "$BODY" \
              --label "promotion-scan"
          fi

      - name: No promotable categories
        if: steps.scan.outputs.promotable == '0'
        run: echo "✅ 승격 후보 없음 (모든 카테고리 N < 3)"
