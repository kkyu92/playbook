name: "📊 Weekly Learning Report"

on:
  schedule:
    # 매주 일요일 21:00 KST 목표
    # cron 정의는 UTC 09시 — GitHub scheduler 평균 +2~3h 지연 보정 (2026-04-26 관측)
    - cron: "0 9 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate weekly report
        id: report
        run: node scripts/generate-weekly-report.mjs

      - name: Check for changes
        id: changes
        run: |
          git add content/
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "kkyu92"
          git config user.email "kyusikkyu@gmail.com"
          git add content/
          git commit -m "📊 ${{ steps.report.outputs.title }}"
          git push origin main
