name: "🔁 AI Review Chain — re-fire ai-review after bot push"

# 갭: GitHub 재귀 방지 정책 — GITHUB_TOKEN push 는 다른 workflow 의 push trigger 차단.
# 결과: 봇 push (auto-ingest 등) 가 만든 PR 은 ai-review.yml 미트리거 → 누적.
# 해결: workflow_run 으로 봇 push workflow 완료 신호 받기 (workflow_run 은 재귀 방지 무관)
#       → 빈 commit 을 PAT 으로 push → ai-review.yml push trigger 정상 fire
#       → 자동 머지.
#
# head_branch 갭: workflow_run.head_branch = trigger 워크플로 fire branch (cron = main).
# 봇 PR 의 head branch 와 분리되므로, 직접 gh API 로 봇 PR head lookup.
#
# 빈 commit 은 squash merge 시 자동 제거됨 (history clean).
# PAT (GH_PAT) = notify-workers.yml 에서 이미 사용 중. 새 secret X.

on:
  workflow_run:
    workflows:
      - "🔄 Auto-Ingest from Worker"
      - "🔭 Daily Ingest — GeekNews"
      - "📊 Weekly Learning Report"
    types: [completed]

permissions:
  contents: write
  pull-requests: read

jobs:
  re-trigger:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Find target bot PR head
        id: target
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          # workflow name → 봇 PR branch prefix 매핑
          case "$RUN_NAME" in
            "🔄 Auto-Ingest from Worker")
              PREFIX="auto-ingest/journal-"
              ;;
            "🔭 Daily Ingest — GeekNews")
              PREFIX="auto-ingest/geeknews-"
              ;;
            "📊 Weekly Learning Report")
              echo "::notice::Weekly report pushes to main directly — no PR to chain"
              echo "head=" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "::notice::Unknown trigger workflow: $RUN_NAME — chain skipped"
              echo "head=" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          # 가장 최근 OPEN 봇 PR (prefix 일치) 찾기
          PR_HEAD=$(gh pr list --repo "$REPO" --state open --limit 10 \
            --json headRefName,createdAt \
            --jq "[.[] | select(.headRefName | startswith(\"$PREFIX\"))] | sort_by(.createdAt) | reverse | .[0].headRefName // empty")
          if [ -z "$PR_HEAD" ]; then
            echo "::notice::No open bot PR found for prefix $PREFIX — chain skipped"
            echo "head=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Found target PR head: $PR_HEAD"
          echo "head=$PR_HEAD" >> "$GITHUB_OUTPUT"

      - name: Checkout head branch
        if: steps.target.outputs.head != ''
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.head }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Empty commit to re-fire ai-review
        if: steps.target.outputs.head != ''
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MSG="chore(trigger): re-fire ai-review after ${{ github.event.workflow_run.name }}"
          git commit --allow-empty -m "$MSG"
          git push origin HEAD:${{ steps.target.outputs.head }}
          echo "✅ Empty commit pushed to ${{ steps.target.outputs.head }} — ai-review.yml will fire on push trigger"
