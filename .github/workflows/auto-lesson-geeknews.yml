name: "📰 Auto Lesson from GeekNews"

# 매일 08:50 KST (23:50 UTC) — daily-lesson (09:05 KST) 10분 전 실행.
# 24h 지난 미응답 "오늘의 학습" Issue 있으면 긱뉴스 큐레이션 fallback → 자동 엔트리 생성.
#
# 이식: Mino777/ai-study (2026-04-20). npm → pnpm, git user 조정.

on:
  schedule:
    - cron: "50 23 * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "특정 이슈 번호 지정 (비우면 자동 감지)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-curate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for stale daily lesson issues
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
        run: |
          # 수동 지정된 이슈가 있으면 바로 사용
          if [ -n "$INPUT_ISSUE" ]; then
            echo "issue_number=$INPUT_ISSUE" >> $GITHUB_OUTPUT
            echo "has_stale=true" >> $GITHUB_OUTPUT
            echo "stale_count=1" >> $GITHUB_OUTPUT
            echo "📋 수동 지정 이슈: #$INPUT_ISSUE"
            exit 0
          fi

          # 24h 이상 된 미응답 "오늘의 학습" 이슈 찾기
          STALE_ISSUES=$(gh issue list \
            --repo ${{ github.repository }} \
            --state open \
            --search "오늘의 학습 주제를 골라주세요 in:title" \
            --json number,title,createdAt \
            --jq '[.[] | select(
              (now - (.createdAt | fromdateiso8601)) > 72000
            )]')

          COUNT=$(echo "$STALE_ISSUES" | jq 'length')
          echo "stale_count=$COUNT" >> $GITHUB_OUTPUT

          if [ "$COUNT" -gt 0 ]; then
            ISSUE_NUM=$(echo "$STALE_ISSUES" | jq -r '.[0].number')
            echo "issue_number=$ISSUE_NUM" >> $GITHUB_OUTPUT
            echo "has_stale=true" >> $GITHUB_OUTPUT
            echo "📋 스테일 이슈 발견: #$ISSUE_NUM ($COUNT건)"
          else
            echo "has_stale=false" >> $GITHUB_OUTPUT
            echo "✅ 스테일 이슈 없음 — 스킵"
          fi

      - name: Checkout
        if: steps.check.outputs.has_stale == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        if: steps.check.outputs.has_stale == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: Setup Node.js
        if: steps.check.outputs.has_stale == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.check.outputs.has_stale == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build manifest
        if: steps.check.outputs.has_stale == 'true'
        run: node scripts/generate-content-manifest.mjs

      - name: Curate from GeekNews + Generate entry
        if: steps.check.outputs.has_stale == 'true'
        id: curate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/curate-geeknews.mjs

      - name: Create PR
        if: steps.check.outputs.has_stale == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOPIC: ${{ steps.curate.outputs.selected_topic }}
          SOURCE_TITLE: ${{ steps.curate.outputs.selected_title }}
          SOURCE_LINK: ${{ steps.curate.outputs.selected_link }}
          ISSUE_NUM: ${{ steps.check.outputs.issue_number }}
        run: |
          SAFE_TOPIC=$(echo "$TOPIC" | tr '`' "'")
          DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          BRANCH="auto-lesson/${DATE}-geeknews"

          git config user.name "kkyu92"
          git config user.email "kyusikkyu@gmail.com"

          git checkout -b "$BRANCH"
          git add content/
          git commit -m "📰 긱뉴스 자동 큐레이션: ${SAFE_TOPIC}

          Source: ${SOURCE_TITLE}
          Link: ${SOURCE_LINK}
          Generated by AI 과외 선생님 (GeekNews auto-curation)
          Stale issue: #${ISSUE_NUM}"

          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "📰 긱뉴스 자동 학습: ${SAFE_TOPIC}" \
            --body "## 📰 긱뉴스 자동 큐레이션

          **주제:** ${SAFE_TOPIC}
          **원본:** [${SOURCE_TITLE}](${SOURCE_LINK})
          **날짜:** ${DATE}
          **트리거:** Issue #${ISSUE_NUM} 24시간 미응답

          ### 왜 이 글?
          Gemini 가 긱뉴스 최신 글 중 위키 방향성 (playbook) 에 가장 부합하는 글 자동 선정.

          ### 학습 방법
          1. PR 파일 읽고 학습
          2. 틀린/보충할 내용 직접 수정
          3. 머지 → 위키 자동 반영

          > 이 PR 은 CI 통과 시 자동 머지됩니다 (Auto Merge workflow)." \
            --base main \
            --head "$BRANCH")

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Close stale issue
        if: steps.check.outputs.has_stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ steps.check.outputs.issue_number }} \
            --repo ${{ github.repository }} \
            --body "⏰ 24시간 동안 응답이 없어 **긱뉴스 자동 큐레이션** 으로 대체되었습니다.

          📰 **선정된 글:** ${{ steps.curate.outputs.selected_title }}
          📝 **생성된 PR:** ${{ steps.pr.outputs.pr_url }}

          > 다음엔 이슈에 번호(1/2/3)를 댓글로 남겨주세요!"

          gh issue close ${{ steps.check.outputs.issue_number }} \
            --repo ${{ github.repository }} \
            --reason "not planned"

      - name: Create actionable issue if applicable
        if: steps.check.outputs.has_stale == 'true' && steps.curate.outputs.actionable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION_TARGET: ${{ steps.curate.outputs.action_target }}
          ACTION_SUMMARY: ${{ steps.curate.outputs.action_summary }}
          ACTION_DETAIL: ${{ steps.curate.outputs.action_detail }}
          TOPIC: ${{ steps.curate.outputs.selected_topic }}
          SOURCE_LINK: ${{ steps.curate.outputs.selected_link }}
        run: |
          gh label create actionable-insight --color "0e8a16" --description "긱뉴스 큐레이션에서 감지된 이식 후보" 2>/dev/null || true

          gh issue create \
            --repo ${{ github.repository }} \
            --title "🔧 이식 후보: ${ACTION_SUMMARY}" \
            --label "actionable-insight" \
            --body "## 🔧 긱뉴스 큐레이션에서 발견된 이식 후보

          **출처 엔트리:** ${TOPIC}
          **원본:** ${SOURCE_LINK}
          **대상 프로젝트:** ${ACTION_TARGET}

          ### 구체적 액션
          ${ACTION_DETAIL}

          ---
          > 이 이슈는 긱뉴스 자동 큐레이션에서 Gemini 가 프로젝트 이식 가능성을 감지하여 자동 생성되었습니다.
          > 검토 후 작업 시작 또는 해당 없으면 클로즈하세요."

      - name: Close remaining stale issues
        if: steps.check.outputs.has_stale == 'true' && steps.check.outputs.stale_count > 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list \
            --repo ${{ github.repository }} \
            --state open \
            --search "오늘의 학습 주제를 골라주세요 in:title" \
            --json number \
            --jq '.[].number' | while read NUM; do
            if [ "$NUM" != "${{ steps.check.outputs.issue_number }}" ]; then
              gh issue close "$NUM" --repo ${{ github.repository }} --reason "not planned" \
                --comment "⏰ 기한 초과 — 자동 정리됨"
            fi
          done
