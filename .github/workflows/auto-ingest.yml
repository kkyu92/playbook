name: "🔄 Auto-Ingest from Worker"

on:
  repository_dispatch:
    types: [worker-error, worker-lesson]
  workflow_dispatch:
    inputs:
      source_repo:
        description: "워커 레포 (예: kkyu92/moneyballscore)"
        required: true
      error_title:
        description: "에러/교훈 제목"
        required: true
      error_body:
        description: "에러 로그 또는 교훈 내용"
        required: true
      error_type:
        description: "타입 (error-log, lesson, pattern)"
        default: "error-log"

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "source_repo=${{ github.event.client_payload.source_repo }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.client_payload.title }}" >> $GITHUB_OUTPUT
            echo "body=${{ github.event.client_payload.body }}" >> $GITHUB_OUTPUT
            echo "type=${{ github.event.client_payload.type }}" >> $GITHUB_OUTPUT
          else
            echo "source_repo=${{ inputs.source_repo }}" >> $GITHUB_OUTPUT
            echo "title=${{ inputs.error_title }}" >> $GITHUB_OUTPUT
            echo "body=${{ inputs.error_body }}" >> $GITHUB_OUTPUT
            echo "type=${{ inputs.error_type }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate Journal entry
        id: generate
        run: |
          DATE=$(date +%Y-%m-%d)
          SLUG_DATE=$(date +%Y%m%d)

          # 다음 Journal 번호 계산
          LAST_NUM=$(ls content/journal/playbook-journal-*.mdx 2>/dev/null | sed 's/.*journal-\([0-9]*\).*/\1/' | sort -n | tail -1)
          NEXT_NUM=$(printf "%03d" $((10#${LAST_NUM:-0} + 1)))

          # slug 생성 (title에서)
          TITLE="${{ steps.inputs.outputs.title }}"
          SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9가-힣]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-50)

          FILENAME="content/journal/playbook-journal-${NEXT_NUM}-${SLUG}.mdx"

          # raw source 저장
          mkdir -p raw-sources
          cat > "raw-sources/${SLUG_DATE}-${SLUG}.md" << 'RAWEOF'
          ---
          date: "${{ steps.inputs.outputs.title }}"
          source: "${{ steps.inputs.outputs.source_repo }}"
          type: "${{ steps.inputs.outputs.type }}"
          ---

          ${{ steps.inputs.outputs.body }}
          RAWEOF

          # Journal MDX 생성
          cat > "$FILENAME" << MDXEOF
          ---
          title: "Playbook Journal ${NEXT_NUM} — ${TITLE}"
          category: harness-engineering
          date: "${DATE}"
          tags: [playbook-journal, auto-ingest, ${{ steps.inputs.outputs.type }}, $(echo "${{ steps.inputs.outputs.source_repo }}" | sed 's/.*\///' )]
          confidence: 3
          connections: []
          status: in-progress
          description: "자동 수집: ${TITLE} (from ${{ steps.inputs.outputs.source_repo }})"
          type: entry
          series: playbook-journal
          ---

          > 이 엔트리는 워커 프로젝트에서 자동 수집되었습니다.
          > Source: ${{ steps.inputs.outputs.source_repo }}
          > Type: ${{ steps.inputs.outputs.type }}

          ## 원본

          ${{ steps.inputs.outputs.body }}

          ## 분석

          _TODO: 수동으로 분석 추가 또는 다음 세션에서 /ingest로 보강_

          ## 교훈

          _TODO: 교훈 정리_

          ## 적용

          _TODO: 다음 액션_
          MDXEOF

          echo "filename=${FILENAME}" >> $GITHUB_OUTPUT
          echo "next_num=${NEXT_NUM}" >> $GITHUB_OUTPUT

      - name: Regenerate manifest
        run: node scripts/generate-content-manifest.mjs

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="auto-ingest/journal-${{ steps.generate.outputs.next_num }}"
          git config user.name "kkyu92"
          git config user.email "kyusikkyu@gmail.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "feat(auto-ingest): Journal ${{ steps.generate.outputs.next_num }} — ${{ steps.inputs.outputs.title }}"
          git push origin "$BRANCH"
          gh pr create \
            --title "📓 Auto-Ingest: Journal ${{ steps.generate.outputs.next_num }} — ${{ steps.inputs.outputs.title }}" \
            --body "워커 프로젝트(${{ steps.inputs.outputs.source_repo }})에서 자동 수집된 Journal 엔트리입니다.

          **Type:** ${{ steps.inputs.outputs.type }}
          **Source:** ${{ steps.inputs.outputs.source_repo }}

          > 이 PR은 auto-ingest 워크플로우에 의해 자동 생성되었습니다.
          > 내용을 확인하고 분석/교훈/적용 섹션을 보강한 후 머지해주세요." \
            --base main \
            --head "$BRANCH"
