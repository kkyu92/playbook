name: "🔄 Auto-Ingest from Worker"

on:
  repository_dispatch:
    types: [worker-error, worker-incident, worker-lesson]
  workflow_dispatch:
    inputs:
      source_repo:
        description: "워커 레포 (예: kkyu92/moneyballscore)"
        required: true
      error_title:
        description: "에러/교훈 제목"
        required: true
      error_body:
        description: "에러 로그 또는 교훈 내용"
        required: true
      event_type:
        description: "이벤트 타입"
        type: choice
        default: "worker-error"
        options:
          - worker-error
          - worker-incident
          - worker-lesson
      severity:
        description: "(incident 만) warning / error / critical"
        required: false
      fingerprint:
        description: "(incident/lesson 권장) 안정 식별자 — incident-lesson correlation key (Phase 4a D5)"
        required: false
      subtype:
        description: "(lesson 만, Phase 4a D4) self-policy = 워커 자가 정책 갱신. 미정의면 기존 lesson 처리"
        required: false
      intent:
        description: "(가드 테스트) test 면 raw 만 저장 후 종료"
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

# 동시 dispatch race condition 방어 — 같은 fingerprint 의 동시 fire 시 sequential
# 처리. 두 번째 실행이 `--state open` dedup 검색 시 첫 번째 issue 잡힘 → 중복
# 생성 차단. cancel-in-progress=false 로 둘 다 처리 보장 (상실 방지).
concurrency:
  group: auto-ingest-${{ github.event.client_payload.fingerprint || github.event.inputs.fingerprint || github.run_id }}
  cancel-in-progress: false

jobs:
  auto-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Xenova transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: xenova-multilingual-e5-small-v1

      - name: Auto-ingest — route by event type
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_EVENT: ${{ github.event.action }}
          CP_SOURCE: ${{ github.event.client_payload.source_repo }}
          CP_TITLE: ${{ github.event.client_payload.title }}
          CP_BODY: ${{ github.event.client_payload.body }}
          CP_TYPE: ${{ github.event.client_payload.type }}
          CP_SEVERITY: ${{ github.event.client_payload.severity }}
          CP_FINGERPRINT: ${{ github.event.client_payload.fingerprint }}
          CP_FIRST_SEEN: ${{ github.event.client_payload.first_seen }}
          CP_ENVIRONMENT: ${{ github.event.client_payload.environment }}
          CP_RUN_URL: ${{ github.event.client_payload.run_url }}
          CP_INTENT: ${{ github.event.client_payload.intent }}
          CP_SUBTYPE: ${{ github.event.client_payload.subtype }}
          WD_SOURCE: ${{ inputs.source_repo }}
          WD_TITLE: ${{ inputs.error_title }}
          WD_BODY: ${{ inputs.error_body }}
          WD_EVENT: ${{ inputs.event_type }}
          WD_SEVERITY: ${{ inputs.severity }}
          WD_FINGERPRINT: ${{ inputs.fingerprint }}
          WD_INTENT: ${{ inputs.intent }}
          WD_SUBTYPE: ${{ inputs.subtype }}
          # GH_PAT 필수: 이 스텝 안에서 gh pr create 실행. GITHUB_TOKEN 으로
          # 만든 PR 은 CI 가 트리거되지 않음 (action_required 로 차단).
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 1. 입력 normalize (repository_dispatch | workflow_dispatch)
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            SOURCE_REPO="${CP_SOURCE:-}"
            TITLE="${CP_TITLE:-}"
            BODY="${CP_BODY:-}"
            EVENT_TYPE="${DISPATCH_EVENT:-worker-error}"
            PAYLOAD_TYPE="${CP_TYPE:-}"
            SEVERITY="${CP_SEVERITY:-}"
            FINGERPRINT="${CP_FINGERPRINT:-}"
            FIRST_SEEN="${CP_FIRST_SEEN:-}"
            ENVIRONMENT="${CP_ENVIRONMENT:-}"
            RUN_URL="${CP_RUN_URL:-}"
            INTENT="${CP_INTENT:-}"
            SUBTYPE="${CP_SUBTYPE:-}"
          else
            SOURCE_REPO="${WD_SOURCE:-}"
            TITLE="${WD_TITLE:-}"
            BODY="${WD_BODY:-}"
            EVENT_TYPE="${WD_EVENT:-worker-error}"
            PAYLOAD_TYPE=""
            SEVERITY="${WD_SEVERITY:-}"
            FINGERPRINT="${WD_FINGERPRINT:-}"
            FIRST_SEEN=""
            ENVIRONMENT=""
            RUN_URL=""
            INTENT="${WD_INTENT:-}"
            SUBTYPE="${WD_SUBTYPE:-}"
          fi

          # 2. Schema 검증 (A0-2) — fail-loud, visible fallback
          # 2a. 필수 field
          if [ -z "$SOURCE_REPO" ] || [ -z "$TITLE" ] || [ -z "$BODY" ]; then
            echo "::error::필수 필드 누락 (source_repo / title / body)"
            exit 1
          fi

          # 2b. event_type 화이트리스트
          case "$EVENT_TYPE" in
            worker-error|worker-incident|worker-lesson) ;;
            *)
              echo "::warning::알 수 없는 event_type '$EVENT_TYPE' → worker-error fallback"
              EVENT_TYPE="worker-error"
              ;;
          esac

          # 2c. type field 화이트리스트 (incident/lesson 만 검증, error-log 는 default)
          if [ -n "$PAYLOAD_TYPE" ]; then
            case "$PAYLOAD_TYPE" in
              error-log|incident|lesson) ;;
              *)
                echo "::warning::알 수 없는 type '$PAYLOAD_TYPE' → error-log fallback + worker-error 처리"
                PAYLOAD_TYPE="error-log"
                EVENT_TYPE="worker-error"
                ;;
            esac
          fi

          # 2d. severity 화이트리스트 (incident 만)
          if [ "$EVENT_TYPE" = "worker-incident" ] && [ -n "$SEVERITY" ]; then
            case "$SEVERITY" in
              warning|error|critical) ;;
              *)
                echo "::warning::알 수 없는 severity '$SEVERITY' → warning fallback"
                SEVERITY="warning"
                ;;
            esac
          fi

          # 2e. subtype 검증 (lesson 만, Phase 4a D4)
          # payload-validator.mjs 가 화이트리스트 검사 + warning 수집. invalid 면 subtype 무시 (backward-compat)
          if [ "$EVENT_TYPE" = "worker-lesson" ] && [ -n "$SUBTYPE" ]; then
            if ! VALIDATION=$(node scripts/validate-lesson-payload.mjs "$SUBTYPE" "$FINGERPRINT" 2>&1); then
              echo "::warning::subtype validation 실패 → subtype 무시, 기존 lesson 처리: $VALIDATION"
              SUBTYPE=""
            else
              echo "subtype validated: $VALIDATION"
              # warnings 추출 (예: self-policy 인데 fingerprint 누락)
              WARNS=$(echo "$VALIDATION" | jq -r '.warnings[]?' 2>/dev/null || true)
              if [ -n "$WARNS" ]; then
                echo "$WARNS" | while IFS= read -r w; do
                  [ -n "$w" ] && echo "::warning::$w"
                done
              fi
            fi
          fi

          # 2f. intent=test → raw 만 저장 후 종료 (가드 테스트)
          # (raw 저장 부분에서 처리, 검증 후 다음 단계로)

          # 2. slug — ASCII only (locale-independent)
          SLUG=$(printf '%s' "$TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | LC_ALL=C tr -c 'a-z0-9' '-' \
            | sed 's/--*/-/g; s/^-//; s/-$//' \
            | cut -c1-50)
          if [ -z "$SLUG" ]; then
            SLUG="untitled-$(date +%s)"
          fi

          DATE=$(date +%Y-%m-%d)
          SLUG_DATE=$(date +%Y%m%d)
          # workers.config.json 의 registered 이름과 매핑 (moneyballscore → moneyball)
          # basename 이 registered 이름의 prefix 면 그 이름 사용. 매칭 없으면 basename
          SOURCE_BASE=$(basename "$SOURCE_REPO")
          SOURCE_SHORT=$(jq -r --arg src "$SOURCE_BASE" '.registered[] | select(. as $n | $src | startswith($n))' workers.config.json 2>/dev/null | head -1)
          SOURCE_SHORT=${SOURCE_SHORT:-$SOURCE_BASE}

          echo "event_type: $EVENT_TYPE"
          echo "source_repo: $SOURCE_REPO"
          echo "title: $TITLE"
          echo "slug: $SLUG"
          echo "fingerprint: ${FINGERPRINT:-<none>}"
          echo "severity: ${SEVERITY:-<none>}"
          echo "intent: ${INTENT:-normal}"

          # 3. raw-sources 저장 (공통) + fingerprint suffix (A0-3)
          mkdir -p raw-sources

          # raw 파일명 — fingerprint 가 있으면 그대로, 없으면 sha256(source+title+body) 첫 8자
          # (idempotent — 같은 fingerprint = 같은 파일 = 덮어쓰기 안전)
          if [ -n "$FINGERPRINT" ]; then
            FP_SHORT=$(printf '%s' "$FINGERPRINT" | LC_ALL=C tr -c 'a-z0-9-' '-' | sed 's/--*/-/g; s/^-//; s/-$//' | cut -c1-30)
          else
            FP_SHORT=$(printf '%s%s%s' "$SOURCE_REPO" "$TITLE" "$BODY" | shasum -a 256 | cut -c1-8)
          fi
          RAW_FILE="raw-sources/${SLUG_DATE}-${SLUG}-${FP_SHORT}.md"

          # frontmatter 안전 escape
          ESC_TITLE=$(printf '%s' "$TITLE" | sed 's/"/\\"/g; s/\\/\\\\/g')
          ESC_SOURCE=$(printf '%s' "$SOURCE_REPO" | sed 's/"/\\"/g')

          {
            echo "---"
            echo "date: \"$DATE\""
            echo "source: \"$ESC_SOURCE\""
            echo "type: \"$EVENT_TYPE\""
            [ -n "$PAYLOAD_TYPE" ] && echo "payload_type: \"$PAYLOAD_TYPE\""
            [ -n "$SUBTYPE" ] && echo "subtype: \"$SUBTYPE\""
            [ -n "$SEVERITY" ] && echo "severity: \"$SEVERITY\""
            [ -n "$FINGERPRINT" ] && echo "fingerprint: \"$FINGERPRINT\""
            [ -n "$FIRST_SEEN" ] && echo "first_seen: \"$FIRST_SEEN\""
            [ -n "$ENVIRONMENT" ] && echo "environment: \"$ENVIRONMENT\""
            [ -n "$RUN_URL" ] && echo "run_url: \"$RUN_URL\""
            [ -n "$INTENT" ] && echo "intent: \"$INTENT\""
            echo "---"
            echo ""
            printf '%s\n' "$BODY"
          } > "$RAW_FILE"
          echo "✅ raw 저장: $RAW_FILE"

          # raw-sources/ root 누적 방지 — 즉시 _archive/ 이동
          # weekly-triage 스캔 = maxdepth 1 만 → archive 파일은 triage noise 에서 제외
          mkdir -p raw-sources/_archive
          mv "$RAW_FILE" "raw-sources/_archive/$(basename "$RAW_FILE")"
          RAW_FILE="raw-sources/_archive/$(basename "$RAW_FILE")"
          echo "📦 raw archived: $RAW_FILE"

          # git config — 모든 경로 공통
          git config user.name "kkyu92"
          git config user.email "kyusikkyu@gmail.com"

          # main push race retry — 다른 fingerprint 의 동시 dispatch 가 같은 main 에
          # push 시 'main -> main (fetch first)' rejection. concurrency 그룹은 같은 fp
          # 내 직렬화만 보장. pull --rebase + 재시도로 자연 회복 (cycle 47 fix-incident).
          push_main_with_retry() {
            local -  # 함수 종료 시 set 옵션 자동 복원 (set -euo pipefail 격리)
            set +e
            local attempt
            for attempt in 1 2 3 4 5; do
              if git push origin main; then
                return 0
              fi
              echo "⚠️ push 실패 (attempt $attempt/5) — pull --rebase 후 재시도"
              if ! git pull --rebase origin main 2>/dev/null; then
                # rebase 실패 — concurrent dispatch add/add 충돌 가능성 (동일 raw file)
                git rebase --abort 2>/dev/null || true
                git fetch origin main --quiet 2>/dev/null || true
                # HEAD 커밋의 raw-sources 파일이 origin 에 이미 존재하면 push 불필요
                local already_in_origin=true
                local f
                for f in $(git diff-tree --no-commit-id -r --name-only HEAD 2>/dev/null | grep "^raw-sources/"); do
                  if ! git cat-file -e "origin/main:$f" 2>/dev/null; then
                    already_in_origin=false
                    break
                  fi
                done
                if $already_in_origin; then
                  echo "✅ origin 에 이미 동일 raw 파일 — push 불필요 (concurrent race recovery)"
                  return 0
                fi
                return 1
              fi
              sleep $((attempt * 2))
            done
            echo "❌ push 5회 시도 모두 실패 — race condition 미해결"
            return 1
          }

          # 3a. intent=test 가드 — raw 만 저장 후 종료 (Issue/Journal 없음)
          if [ "$INTENT" = "test" ]; then
            echo "🧪 intent=test 감지 → raw 만 저장, Issue/Journal skip (가드 테스트)"
            git add raw-sources/
            if ! git diff --cached --quiet; then
              git commit -m "data: auto-ingest test raw from ${SOURCE_SHORT} — ${TITLE}"
              push_main_with_retry
            fi
            exit 0
          fi

          # 4. event_type 분기 — error / incident / lesson
          if [ "$EVENT_TYPE" = "worker-error" ] || [ "$EVENT_TYPE" = "worker-incident" ]; then
            # 라벨 self-bootstrap
            gh label create inbound --color "f9c74f" --description "워커에서 자동 수집" 2>/dev/null || true
            gh label create raw --color "e0e1dd" --description "raw-sources 미처리" 2>/dev/null || true
            gh label create incident --color "d73a4a" --description "워커 자연 발생 사고" 2>/dev/null || true

            # 분기별 메타
            if [ "$EVENT_TYPE" = "worker-incident" ]; then
              echo "=== INCIDENT 경로: raw + Issue (Journal X — promotion 은 LLM 단계 보류) ==="
              ISSUE_PREFIX="🟠 Inbound incident"
              EXTRA_LABEL="incident"
            else
              echo "=== ERROR 경로: raw + Issue ==="
              ISSUE_PREFIX="🟡 Inbound raw"
              EXTRA_LABEL=""
            fi

            # 4a. 진짜 24h dedup (GNU date — Ubuntu runner) + fingerprint 우선 매칭
            CUTOFF=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)

            # Issue title 에 [fp:xxxx] 박아 검색 가능하게
            FP_TAG="[fp:${FP_SHORT}]"
            ISSUE_TITLE="${ISSUE_PREFIX}: ${TITLE} (from ${SOURCE_SHORT}) ${FP_TAG}"

            # dedup 검색: fingerprint 우선, fallback 으로 title prefix
            DEDUP_KEY="$FP_TAG"
            EXISTING_ISSUE=$(gh issue list \
              --state open \
              --label "inbound" \
              --limit 50 \
              --json number,title,createdAt \
              | jq -r --arg key "$DEDUP_KEY" --arg cutoff "$CUTOFF" '
                  [.[] | select(.title | contains($key)) | select(.createdAt > $cutoff)]
                  | sort_by(.createdAt) | reverse | .[0].number // empty
                ')

            if [ -n "$EXISTING_ISSUE" ]; then
              # 기존 Issue 에 재발 코멘트
              COMMENT_BODY=$(cat <<COMMENTEND
          🔁 재발 감지 (${DATE})

          - Source: \`${SOURCE_REPO}\`
          - Raw: \`${RAW_FILE}\`
          - Fingerprint: \`${FINGERPRINT:-(generated)}\`
          - Severity: \`${SEVERITY:-(none)}\`
          ${RUN_URL:+- Run: ${RUN_URL}}
          COMMENTEND
          )
              gh issue comment "$EXISTING_ISSUE" --body "$COMMENT_BODY"
              echo "✅ 기존 Issue #${EXISTING_ISSUE} 에 재발 코멘트 (fingerprint 매칭)"
            else
              # 신규 Issue
              ISSUE_BODY=$(cat <<ISSUEEND
          **Source:** \`${SOURCE_REPO}\`
          **Type:** \`${EVENT_TYPE}\` (\`${PAYLOAD_TYPE:-error-log}\`)
          **Severity:** \`${SEVERITY:-(none)}\`
          **Fingerprint:** \`${FINGERPRINT:-(auto: ${FP_SHORT})}\`
          **Environment:** \`${ENVIRONMENT:-(none)}\`
          **First seen:** \`${FIRST_SEEN:-(none)}\`
          **Run URL:** ${RUN_URL:-(none)}
          **Raw:** \`${RAW_FILE}\`

          허브 세션에서 \`/ingest\` 로 검토 후 처리하세요. 관련 엔트리가 있으면 \`connections\` 만 추가, 재발 패턴이면 \`docs/solutions/\` 로 정리해도 됩니다.

          ---

          ## 원본

          ~~~
          ${BODY}
          ~~~
          ISSUEEND
          )
              LABELS="inbound,raw"
              [ -n "$EXTRA_LABEL" ] && LABELS="${LABELS},${EXTRA_LABEL}"
              gh issue create \
                --title "$ISSUE_TITLE" \
                --body "$ISSUE_BODY" \
                --label "$LABELS" \
                --assignee kkyu92
              echo "✅ 신규 Issue 생성 (labels: $LABELS)"
            fi

            # raw-sources/ commit
            git add raw-sources/
            if git diff --cached --quiet; then
              echo "raw-sources 변경 없음, push 생략 (fingerprint idempotent)"
            else
              git commit -m "data: auto-ingest raw from ${SOURCE_SHORT} — ${TITLE}"
              # push fail = step fail (self-report 발화). incident issue 는 open 유지 = 재발 코멘트로 자연 회복
              push_main_with_retry || exit 1
            fi

          elif [ "$SUBTYPE" = "self-policy" ]; then
            echo "=== SELF-POLICY 경로: raw + Issue (label self-policy, Journal PR skip) ==="

            # 라벨 self-bootstrap
            gh label create inbound --color "f9c74f" --description "워커에서 자동 수집" 2>/dev/null || true
            gh label create self-policy --color "0e8a16" --description "워커 자가 정책 갱신 (D4)" 2>/dev/null || true

            FP_TAG="[fp:${FP_SHORT}]"
            ISSUE_TITLE="🔧 Self-policy: ${TITLE} (from ${SOURCE_SHORT}) ${FP_TAG}"

            ISSUE_BODY=$(cat <<SPEND
          **Source:** \`${SOURCE_REPO}\`
          **Type:** \`worker-lesson\` / subtype=\`self-policy\`
          **Fingerprint:** \`${FINGERPRINT:-(auto: ${FP_SHORT})}\`
          **Raw:** \`${RAW_FILE}\`

          워커가 자기 정책을 갱신했습니다 (\`policy:\` / \`feedback:\` / \`memory:\` prefix commit). 허브에서 검토 후 필요 시 entry 박제.

          ---

          ## 원본

          ~~~
          ${BODY}
          ~~~
          SPEND
          )
            ISSUE_URL=$(gh issue create \
              --title "$ISSUE_TITLE" \
              --body "$ISSUE_BODY" \
              --label "inbound,self-policy" \
              --assignee kkyu92)
            ISSUE_NUM=$(echo "$ISSUE_URL" | sed -n 's|.*/issues/\([0-9][0-9]*\)|\1|p')
            echo "✅ Self-policy Issue 생성 (#${ISSUE_NUM})"

            git add raw-sources/
            if git diff --cached --quiet; then
              echo "raw-sources 변경 없음, push 생략 (fingerprint idempotent)"
              POLICY_COMMIT=""
            else
              git commit -m "data: auto-ingest self-policy from ${SOURCE_SHORT} — ${TITLE}"
              PUSH_FAILED=0
              if ! push_main_with_retry; then
                PUSH_FAILED=1
              fi
              POLICY_COMMIT=$([ "$PUSH_FAILED" = "0" ] && git rev-parse HEAD || echo "")
            fi

            # self-policy = data-only (no review needed). push 성공/실패 무관 항상 close
            # (audit trail 보존 — push 실패 시 close body 에 ⚠ 명시)
            if [ -n "$ISSUE_NUM" ]; then
              if [ "${PUSH_FAILED:-0}" = "0" ]; then
                CLOSE_BODY="✅ self-policy raw-sources/ 머지 완료 → 자동 close (audit trail 보존). commit: ${POLICY_COMMIT:-(no change — fingerprint idempotent)}, raw: ${RAW_FILE}"
              else
                CLOSE_BODY="⚠️ self-policy push 실패 (race 5회 retry 소진) — audit trail 보존을 위해 close. raw: ${RAW_FILE}, Run: ${RUN_URL:-N/A}. 다음 dispatch 에서 fingerprint idempotent 로 회복 예정."
              fi
              gh issue close "$ISSUE_NUM" --comment "$CLOSE_BODY" --reason completed
              echo "🤖 Self-policy Issue #${ISSUE_NUM} 자동 close (push_failed=${PUSH_FAILED:-0})"
            fi

          else
            echo "=== LESSON 경로: raw + Journal draft + PR ==="

            # 다음 Journal 번호 — 머지된 entry + 열린 PR 브랜치 둘 다 고려 (race fix)
            # ls-remote 로 auto-ingest/journal-NNN 브랜치 추가 스캔. 동시 dispatch 시 같은 번호 충돌 차단
            LAST_FILE_NUM=$(ls content/journal/playbook-journal-*.mdx 2>/dev/null \
              | sed 's/.*journal-\([0-9]*\).*/\1/' \
              | sort -n | tail -1)
            LAST_BRANCH_NUM=$(git ls-remote origin 'refs/heads/auto-ingest/journal-*' 2>/dev/null \
              | sed 's|.*refs/heads/auto-ingest/journal-\([0-9]*\)|\1|' \
              | sort -n | tail -1)
            LAST_NUM=$(printf '%s\n%s\n' "${LAST_FILE_NUM:-0}" "${LAST_BRANCH_NUM:-0}" | sort -n | tail -1)
            NEXT_NUM=$(printf "%03d" $((10#${LAST_NUM} + 1)))

            JOURNAL_FILE="content/journal/playbook-journal-${NEXT_NUM}-${SLUG}.mdx"

            # MDX frontmatter escape + body 는 fenced code block 안에 넣어 안전화
            {
              echo "---"
              echo "title: \"Playbook Journal ${NEXT_NUM} — ${ESC_TITLE}\""
              echo "category: harness-engineering"
              echo "date: \"${DATE}\""
              echo "tags: [playbook-journal, auto-ingest, lesson, ${SOURCE_SHORT}]"
              echo "confidence: 3"
              echo "connections: []"
              echo "status: in-progress"
              echo "description: \"자동 수집: ${ESC_TITLE} (from ${SOURCE_REPO})\""
              echo "type: entry"
              echo "series: playbook-journal"
              echo "raw_source: \"${RAW_FILE}\""
              echo "---"
              echo ""
              echo "> 이 엔트리는 워커 프로젝트에서 자동 수집되었습니다."
              echo "> Source: \`${SOURCE_REPO}\`"
              echo "> Type: \`${EVENT_TYPE}\`"
              echo ""
              echo "## 원본"
              echo ""
              echo "~~~"
              printf '%s\n' "$BODY"
              echo "~~~"
              echo ""
              echo "## 분석"
              echo ""
              echo "_TODO: 수동으로 분석 추가 또는 다음 세션에서 /ingest 로 보강_"
              echo ""
              echo "## 교훈"
              echo ""
              echo "_TODO: 교훈 정리_"
              echo ""
              echo "## 적용"
              echo ""
              echo "_TODO: 다음 액션_"
            } > "$JOURNAL_FILE"
            echo "✅ Journal draft: $JOURNAL_FILE"

            # auto-connections: semantic search 기반 connections 자동 생성 + 양방향 연결
            node scripts/auto-connections.mjs "$JOURNAL_FILE" 8 || echo "⚠️ auto-connections 실패 — connections: [] 유지"

            # manifest 재생성
            node scripts/generate-content-manifest.mjs

            # Branch + commit + PR
            BRANCH="auto-ingest/journal-${NEXT_NUM}"
            git checkout -b "$BRANCH"
            git add -A
            git commit -m "feat(auto-ingest): Journal ${NEXT_NUM} — ${TITLE}"
            # branch push 도 retry — 같은 BRANCH 동시 dispatch 시 race 가능 (TODOS [P1])
            push_branch_with_retry() {
              local attempt
              for attempt in 1 2 3 4 5; do
                if git push origin "$BRANCH"; then
                  return 0
                fi
                echo "⚠️ branch push 실패 (attempt ${attempt}/5) — pull --rebase 후 재시도"
                git pull --rebase origin "$BRANCH" 2>/dev/null || true
                sleep $((attempt * 2))
              done
              echo "❌ branch push 5회 시도 실패"
              return 1
            }
            push_branch_with_retry || exit 1

            PR_BODY=$(cat <<PREND
          워커 프로젝트(\`${SOURCE_REPO}\`)에서 자동 수집된 Journal 엔트리입니다.

          **Type:** \`${EVENT_TYPE}\`
          **Source:** \`${SOURCE_REPO}\`
          **Raw:** \`${RAW_FILE}\`

          > 이 PR 은 auto-ingest 워크플로우에 의해 자동 생성되었습니다.
          > 분석/교훈/적용 섹션을 보강하고 \`connections\` 을 채운 후 머지해주세요.
          PREND
          )
            gh pr create \
              --title "📓 Auto-Ingest: Journal ${NEXT_NUM} — ${TITLE}" \
              --body "$PR_BODY" \
              --base main \
              --head "$BRANCH" \
              --assignee kkyu92
            echo "✅ PR 생성"
          fi

      # Critical Gap 1 방어 — auto-ingest 자체 실패 가시화 (silent drop 방지)
      # 실패 시 open hub-self-report Issue 가 있으면 코멘트, 없으면 신규 Issue 생성.
      - name: Self-report on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_EVENT: ${{ github.event.action }}
          CP_SOURCE: ${{ github.event.client_payload.source_repo }}
          CP_TITLE: ${{ github.event.client_payload.title }}
          WD_SOURCE: ${{ inputs.source_repo }}
          WD_TITLE: ${{ inputs.error_title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e

          SOURCE="${CP_SOURCE:-${WD_SOURCE:-(unknown)}}"
          ORIG_TITLE="${CP_TITLE:-${WD_TITLE:-(no title)}}"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # 라벨 self-bootstrap — self-report 는 메인 step bootstrap (line 233-235) 도달 전에도 발사됨
          # → 필요한 모든 라벨 (inbound / incident / hub-self-report) 여기서 직접 보장
          gh label create inbound --color "f9c74f" --description "워커에서 자동 수집" 2>/dev/null || true
          gh label create incident --color "d73a4a" --description "워커 자연 발생 사고" 2>/dev/null || true
          gh label create hub-self-report --color "b60205" --description "허브 auto-ingest 자체 실패" 2>/dev/null || true

          # 기존 open self-report Issue 검색 (열려 있으면 코멘트로 통합)
          EXISTING=$(gh issue list \
            --state open \
            --label "hub-self-report" \
            --limit 1 \
            --json number \
            | jq -r '.[0].number // empty')

          COMMENT_BODY=$(cat <<EOF
          🚨 추가 실패 감지 (${NOW})

          - **Run:** ${RUN_URL}
          - **Event:** \`${EVENT_NAME}\` / \`${DISPATCH_EVENT:-(none)}\`
          - **Source:** \`${SOURCE}\`
          - **Original title:** ${ORIG_TITLE}
          EOF
          )

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$COMMENT_BODY"
            echo "🚨 기존 self-report Issue #${EXISTING} 에 코멘트 추가"
          else
            ISSUE_BODY=$(cat <<EOF
          ## 허브 self-report (Critical Gap 1)

          \`auto-ingest.yml\` workflow 가 실패했습니다. 워커 dispatch 가 silent drop 되었을 가능성.

          - **Run:** ${RUN_URL}
          - **Event:** \`${EVENT_NAME}\` / \`${DISPATCH_EVENT:-(none)}\`
          - **Source repo:** \`${SOURCE}\`
          - **Original title:** ${ORIG_TITLE}
          - **First detected:** ${NOW}

          ## 조치

          1. Run URL 에서 실패 step / 로그 확인
          2. 워커 측 dispatch payload 검증 (필수 필드 누락, schema 불일치)
          3. 필요 시 워커 dispatch 재발사 또는 이 워크플로우 \`workflow_dispatch\` 로 수동 재시도
          4. 해결되면 Issue close — 다음 실패 시 새 Issue 가 생성됨

          > 이 Issue 가 열려 있는 동안 추가 실패는 코멘트로 통합됩니다 (노이즈 방지).
          EOF
          )
            gh issue create \
              --title "🚨 허브 auto-ingest 실패 — silent drop 방어" \
              --body "$ISSUE_BODY" \
              --label "inbound,incident,hub-self-report" \
              --assignee kkyu92
            echo "🚨 신규 self-report Issue 생성"
          fi
